function empty(label){return `<div class="empty"><div style="font-size:28px">▧</div><strong>${safe(label)}</strong><span>${S.lang==='uz'?'Yangi buyurtma yarating':'Создайте новую заявку'}</span></div>`}
function render(){document.body.classList.toggle('light',!!S.light);let page={home,catalog,product,boost,orders,wallet,profile,admin}[S.page]||home;document.getElementById('app').innerHTML=head()+`<main class="content">${page()}</main>`+bottom();renderModal()}
function renderModal(){let layer=document.getElementById('layer');if(!S.modal){layer.innerHTML='';return}
 let content='',title='';
 if(S.modal==='topup'){
  title=t('addFunds');content=`<label class="field-label">${t('minTopup')}</label><input id="topupAmount" type="number" min="1000" max="100000000" class="field" value="${S.topupAmount}"><div class="chip-row">${[10000,30000,50000,100000].map(v=>`<button class="chip ${Number(S.topupAmount)===v?'active':''}" data-topup-presets="${v}">${new Intl.NumberFormat('ru-RU').format(v)}</button>`).join('')}</div><label class="field-label">${t('methods')}</label><div class="method-grid">${[['uzcard','UZCARD','💳'],['humo','HUMO','💳'],['stars','Stars','⭐']].map(([id,label,ico])=>`<button class="method ${S.topupMethod===id?'active':''}" data-topup-method="${id}"><span>${ico}</span>${label}</button>`).join('')}</div><div class="note">${S.topupMethod==='stars'?t('starsNote'):t('cardNote')}</div><button class="primary" data-action="prepare-topup">${t('checkout')} →</button>`;
 } else if(S.modal==='checkout'){
   let i=S.paymentIntent;title=t('payment');content=`<div class="notice-card"><h3>${safe(i.title)}</h3><p>${safe(i.userId||'@demo_user')}</p><div class="price-box" style="margin-bottom:0"><span>${t('amount')}</span><strong>${fmt(i.amount)}</strong></div></div><label class="field-label">${t('chooseMethod')}</label>${[['uzcard','UZCARD','💳','Ручное подтверждение'],['humo','HUMO','💳','Ручное подтверждение'],['balance',t('balance'),'◈',fmt(S.balance)]].filter(([id])=>i.kind!=='topup'||id!=='balance').map(([id,label,ico,hint])=>`<button class="modal-method ${S.checkoutMethod===id?'active':''}" data-checkout-method="${id}"><span style="font-size:23px">${ico}</span><span class="grow"><b>${label}</b><small>${hint}</small></span><span>${S.checkoutMethod===id?'◉':'◯'}</span></button>`).join('')}<p class="hint">${t('cardNote')}</p><button class="primary" data-action="proceed-payment">${t('checkout')} →</button>`;
 }else if(S.modal==='bank'){
   let i=S.paymentIntent;title=t('bankTitle');content=`<div class="notice-card"><h3>${S.checkoutMethod.toUpperCase()}</h3><p>${t('recipient')}: <strong>ARSLAN SHOP · DEMO</strong></p><div class="price-box" style="margin:0"><span>${t('amount')}</span><strong>${fmt(i.amount)}</strong></div></div><div class="note">${t('cardNote')} ${S.lang==='uz'?'Haqiqiy to‘lov kelganidan keyin admin tasdiqlaydi.':'Администратор подтверждает только после фактического поступления средств.'}</div><button class="primary" data-action="submit-payment">${t('sendReview')}</button><button class="secondary" style="width:100%;margin-top:9px" data-action="back-checkout">‹ ${t('chooseMethod')}</button>`;
 }else if(S.modal==='stars'){
  let i=S.paymentIntent;title='Telegram Stars · DEMO';content=`<div class="notice-card"><h3>${fmt(i.amount)}</h3><p>${t('starsNote')}</p></div><div class="note">${S.lang==='uz'?'Bosilganda faqat demo balans o‘zgaradi. Telegram hisobidan Stars yechilmaydi.':'Нажатие изменит только демо-баланс. Stars из Telegram не списываются.'}</div><button class="primary" data-action="simulate-stars">${S.lang==='uz'?'Test to‘lovni tasdiqlash':'Симулировать успешную оплату'}</button>`;
 }else if(S.modal==='support'){
  title=t('support');content=`<div class="notice-card"><h3>ARSLAN SUPPORT</h3><p>${t('supportMsg')}</p><a class="primary" style="text-align:center" target="_blank" rel="noopener" href="https://t.me/khblyv">@khblyv ↗</a></div><p class="hint">${S.lang==='uz'?'Bu havola haqiqiy Telegram profilini ochadi.':'Эта ссылка открывает настоящий Telegram.'}</p>`;
 }else if(S.modal==='referral'){
  title=t('referral');content=`<div class="notice-card"><h3>50% ${S.lang==='uz'?'sof foydadan':'чистой прибыли'}</h3><p>${S.lang==='uz'?'Yangi mijozlarni olib keling, tasdiqlangan xaridlardan bonus oling.':'Приводите новых клиентов и получайте выплаты с подтверждённых покупок.'}</p></div><a class="primary" style="text-align:center" href="https://t.me/khblyv" target="_blank" rel="noopener">${S.lang==='uz'?'Admin bilan bog‘lanish':'Связаться с админом'} ↗</a>`;
 }
 layer.innerHTML=`<div class="modal-back" onclick="if(event.target===this){action('dismiss')}"><section class="modal" role="dialog" aria-modal="true" aria-label="${safe(title)}"><div class="modal-head"><h2>${safe(title)}</h2><button class="close" data-action="dismiss">×</button></div>${content}</section></div>`;
}
function beginOrder(kind,title,amount,userId){S.paymentIntent={kind,title,amount,userId};S.checkoutMethod='uzcard';S.modal='checkout';save();renderModal()}
function makeRequest(intent,method){let orderId=null;if(intent.kind!=='topup'){orderId=S.nextId++;S.orders.push({id:orderId,kind:intent.kind,title:intent.title,amount:intent.amount,userId:intent.userId,status:'pending',method})}
 let r={id:S.nextId++,orderId,kind:intent.kind,title:intent.title,amount:intent.amount,userId:intent.userId,method,status:'pending',createdAt:Date.now()};S.requests.push(r);return r}
function approve(id,yes){let r=S.requests.find(x=>x.id===id);if(!r||r.status!=='pending'){toast('Already reviewed');return}r.status=yes?'paid':'rejected';if(yes&&r.kind==='topup')S.balance+=r.amount;if(r.orderId){let o=S.orders.find(x=>x.id===r.orderId);if(o)o.status=r.status}save();render();toast(yes?(S.lang==='uz'?'Tasdiqlandi':'Заявка подтверждена'):(S.lang==='uz'?'Rad etildi':'Заявка отклонена'))}
function read(id){return document.getElementById(id)?.value||''}
function action(a){switch(a){
 case 'open-shop':nav('catalog');break;
 case 'topup':S.topupAmount=30000;S.topupMethod='uzcard';S.modal='topup';save();renderModal();break;
 case 'checkout-product':{let p=item(S.productId);if(!p)return;S.gameid=read('gameid').trim();let q=Math.max(1,Math.min(99,Number(read('quantity'))||1));S.quantity=q;if((p.input==='username'||p.input==='game_id')&&!S.gameid){toast(t('enterid'));return}let o=p.options[S.pack]||p.options[0];beginOrder('shop',p.title+' · '+o[1]+(q>1?' ×'+q:''),o[2]*q,S.gameid||'@demo_user');break}
 case 'checkout-boost':{S.boostId=read('boostId').trim();if(!S.boostId){toast(t('enterid'));return}let price=boostPrice();if(price<=0){toast(S.lang==='uz'?'Yuqoriroq rank tanlang':'Выберите ранг выше текущего');return}let mode={wing:'Напы',comp:'Сорев',duel:'Дуэль'}[S.mode];beginOrder('boost',`Boost ${mode}: ${RANKS[S.from]} → ${RANKS[S.to]}`,price,S.boostId);break}
 case 'prepare-topup':{let amount=Number(read('topupAmount'));if(!Number.isInteger(amount)||amount<1000||amount>100000000){toast('1 000 – 100 000 000 so‘m');return}S.topupAmount=amount;S.paymentIntent={kind:'topup',title:'Пополнение баланса',amount,userId:'@demo_user'};if(S.topupMethod==='stars'){S.modal='stars'}else{S.checkoutMethod=S.topupMethod;S.modal='bank'}save();renderModal();break}
 case 'proceed-payment':{let i=S.paymentIntent;if(S.checkoutMethod==='balance'){if(i.amount>S.balance){toast(t('notEnough'));return}S.balance-=i.amount;let orderId=S.nextId++;S.orders.push({id:orderId,kind:i.kind,title:i.title,amount:i.amount,userId:i.userId,status:'paid',method:'balance'});S.requests.push({id:S.nextId++,orderId,kind:i.kind,title:i.title,amount:i.amount,userId:i.userId,method:'balance',status:'paid',createdAt:Date.now()});S.modal='';save();nav('orders');toast(t('paid'));}else{S.modal='bank';renderModal()}break}
 case 'submit-payment':{let r=makeRequest(S.paymentIntent,S.checkoutMethod);S.modal='';save();nav(S.paymentIntent.kind==='topup'?'wallet':'orders');toast(`${t('request')} #${r.id} · ${t('pending')}`);break}
 case 'simulate-stars':{let i=S.paymentIntent;S.balance+=i.amount;S.requests.push({id:S.nextId++,orderId:null,kind:'topup',title:'Stars demo',amount:i.amount,userId:'@demo_user',method:'stars',status:'paid',createdAt:Date.now()});S.modal='';save();nav('wallet');toast(t('paid')+' · DEMO');break}
 case 'back-checkout':S.modal=S.paymentIntent.kind==='topup'?'topup':'checkout';renderModal();break;
 case 'language':S.lang=S.lang==='uz'?'ru':'uz';save();render();break;
 case 'light':S.light=!S.light;save();render();break;
 case 'dismiss':S.modal='';save();renderModal();break;
 case 'support':S.modal='support';renderModal();break;
 case 'referral':S.modal='referral';renderModal();break;
 case 'reset':if(confirm(S.lang==='uz'?'Demo ma’lumotlarini tozalash?':'Сбросить все демо-данные?')){S={...BASE};save();nav('home');}break;
 }}
document.addEventListener('click',e=>{let el=e.target.closest('[data-page],[data-action],[data-product],[data-filter],[data-pack],[data-mode],[data-topup-presets],[data-topup-method],[data-checkout-method],[data-approve],[data-reject],[data-order-filter],[data-admin-filter]');if(!el)return;if(el.dataset.page){nav(el.dataset.page);return}if(el.dataset.action){action(el.dataset.action);return}if(el.dataset.product){S.productId=el.dataset.product;S.pack=0;S.quantity=1;S.gameid='';nav('product');return}if(el.dataset.filter){S.shopFilter=el.dataset.filter;save();render();return}if(el.dataset.pack!==undefined){S.pack=Number(el.dataset.pack);save();render();return}if(el.dataset.mode){S.mode=el.dataset.mode;save();render();return}if(el.dataset.topupPresets){S.topupAmount=Number(el.dataset.topupPresets);save();renderModal();return}if(el.dataset.topupMethod){S.topupMethod=el.dataset.topupMethod;save();renderModal();return}if(el.dataset.checkoutMethod){S.checkoutMethod=el.dataset.checkoutMethod;save();renderModal();return}if(el.dataset.approve){approve(Number(el.dataset.approve),true);return}if(el.dataset.reject){approve(Number(el.dataset.reject),false);return}if(el.dataset.orderFilter){S.orderFilter=el.dataset.orderFilter;save();render();return}if(el.dataset.adminFilter){S.adminFilter=el.dataset.adminFilter;save();render();return}});
document.addEventListener('input',e=>{const id=e.target.id;switch(id){case 'searchInput':S.search=e.target.value;{let f=S.shopFilter;document.getElementById('product-grid').innerHTML=productsList(CATALOG.filter(p=>(f==='all'||p.group===f)&&(`${p.title} ${p.subtitle}`.toLowerCase().includes(S.search.toLowerCase()))));}break;case 'gameid':S.gameid=e.target.value;break;case 'quantity':S.quantity=e.target.value;{let p=item(S.productId),o=p.options[S.pack]||p.options[0];document.getElementById('totalPrice').textContent=fmt(o[2]*Math.max(1,Number(S.quantity)||1));}break;case 'boostId':S.boostId=e.target.value;break;case 'topupAmount':S.topupAmount=e.target.value;break;}});
document.addEventListener('change',e=>{if(e.target.id==='rankFrom')S.from=Number(e.target.value);if(e.target.id==='rankTo')S.to=Number(e.target.value);if(['rankFrom','rankTo'].includes(e.target.id)){save();document.getElementById('boostPrice').textContent=fmt(boostPrice())}});
render();
</script></body></html>
