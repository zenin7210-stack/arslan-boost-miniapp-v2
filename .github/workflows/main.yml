name: Update ARSLAN BOOST

on:
  push:
    branches: [main]
    paths:
      - 'update.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack Mini App
        run: |
          unzip -o update.zip -d .
          rm -f update.zip

      - name: Save changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Update ARSLAN BOOST"
          git push
